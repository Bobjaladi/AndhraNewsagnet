name: Daily Telugu News Generator

on:
  schedule:
    # GitHub Actions uses UTC time. 
    # For 5:00 AM IST, use: '30 23 * * *' (11:30 PM UTC previous day)
    # For 5:00 PM IST, use: '30 11 * * *' (11:30 AM UTC)
    # Adjust the cron expression below based on whether you want 5 AM or 5 PM IST.
    - cron: '30 23 * * *' 
    
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  generate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the generated file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests deep-translator

      - name: Run news fetcher script
        run: python fetch_telugu_news.py

      - name: Commit and push generated HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit if there are actual changes to prevent empty commits
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update index.html [skip ci]" && git push)
